name: Verification Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  technical-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install
      
      - name: Emulate Installation
        run: |
          echo "Emulating installation process..."
          # Simulate installation steps here
          sleep 2
          echo "Installation complete."
      
      - name: Check for Broken Links
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          # Scansiona tutti i file .html
          args: --verbose --no-progress --offline "**/*.html"

      # Controlla la qualità del codice CSS, JavaScript, HTML, ecc. (variante superlinter)
      - name: Run ESLint
        run: npm run lint

      # Controlla le performance e l'accessibilità del sito con Lighthouse
      - name: Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://127.0.0.1:5173
          uploadArtifacts: true # Ti permette di scaricare il report finale