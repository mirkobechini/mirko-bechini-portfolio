name: Verification Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Node dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Clean install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Vite assets
        run: npm run build

      - name: Check for Broken Links
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          args: --verbose --no-progress --offline "resources/views/*.blade.php"

  php-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Cache Node dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Clean install Node dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.ci .env
          php artisan key:generate --force

      - name: Run PHP tests
        run: php artisan test

  lighthouse:
    if: github.event_name == 'push'
    needs: [quality-checks, php-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Cache Node dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install PHP dependencies (production only)
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.ci .env
          php artisan key:generate --force

      - name: Build Vite assets
        run: npm run build

      - name: Start Laravel server
        run: php artisan serve --port=4173 --host=127.0.0.1 &

      - name: Wait for Laravel server
        run: npx wait-on http://127.0.0.1:4173

      - name: Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173
          configPath: "./lighthouserc.json"
          uploadArtifacts: true

      - name: Write job summary
        if: always()
        run: |
          echo "## Verification Tests summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job: $GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch/Ref: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Run details" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run page: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lighthouse URL tested: http://127.0.0.1:4173" >> "$GITHUB_STEP_SUMMARY"
