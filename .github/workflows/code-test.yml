name: Verification Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  statuses: write
  checks: write

jobs:
  technical-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Emulate Installation
        run: |
          echo "Emulating installation process..."
          # Simulate installation steps here
          sleep 2
          echo "Installation complete."

      - name: Check for Broken Links
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          # Scansiona tutti i file .html
          args: --verbose --no-progress --offline "**/*.html"

      # Controlla la qualità del codice CSS, JavaScript, HTML, ecc. (variante superlinter)
      - name: Run ESLint
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview server
        run: npx wait-on http://127.0.0.1:4173

      # Controlla le performance e l'accessibilità del sito con Lighthouse
      - name: Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173
          uploadArtifacts: true # Ti permette di scaricare il report finale

      - name: Write job summary
        if: always()
        run: |
          echo "## Verification Tests summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job: $GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch/Ref: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Run details" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run page: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lighthouse URL tested: http://127.0.0.1:4173" >> "$GITHUB_STEP_SUMMARY"
